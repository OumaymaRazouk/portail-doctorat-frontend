<div class="auth-page">
  <div class="auth-card">
 
    <div class="auth-header">
      <div class="auth-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="auth-badge-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 7.5L12 4l8 3.5-8 3.5L4 7.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M6 10.5V16c0 .8.5 1.6 1.3 1.9 1.4.7 2.9 1.1 4.7 1.1 1.8 0 3.3-.4 4.7-1.1.8-.3 1.3-1.1 1.3-1.9v-5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
 
      <h1 class="auth-title">Portail Doctorat</h1>
      <p class="auth-subtitle">Connectez-vous à votre espace</p>
    </div>
 
    <div *ngIf="errorMessage" class="auth-alert" role="alert">
      {{ errorMessage }}
    </div>
 
    <form (ngSubmit)="onLogin()" class="auth-form">
      <div class="demo">
        <div class="demo-label">Mode démo — Sélectionnez un rôle :</div>
        <div class="pill-group" role="group" aria-label="Sélection rôle (démo)">
          <button type="button" class="pill" [class.active]="demoRole === 'DOCTORANT'" (click)="demoRole = 'DOCTORANT'" [disabled]="isLoading">Doctorant</button>
          <button type="button" class="pill" [class.active]="demoRole === 'DIRECTEUR'" (click)="demoRole = 'DIRECTEUR'" [disabled]="isLoading">Directeur</button>
          <button type="button" class="pill" [class.active]="demoRole === 'ADMIN'" (click)="demoRole = 'ADMIN'" [disabled]="isLoading">Admin</button>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 7.5a3 3 0 013-3h10a3 3 0 013 3v9a3 3 0 01-3 3H7a3 3 0 01-3-3v-9Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M5 8l7 5 7-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <input
            id="email"
            type="email"
            [(ngModel)]="form.email"
            name="email"
            class="input"
            placeholder="votre.email@exemple.com"
            [disabled]="isLoading"
            required
          >
        </div>
      </div>
 
      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7.5 11V8.5a4.5 4.5 0 019 0V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M6.5 11h11a2 2 0 012 2v5a2 2 0 01-2 2h-11a2 2 0 01-2-2v-5a2 2 0 012-2Z" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </span>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="form.password"
            name="password"
            class="input"
            placeholder="••••••••"
            [disabled]="isLoading"
            required
          >
          <button type="button" class="icon-btn" (click)="showPassword = !showPassword" [disabled]="isLoading" aria-label="Afficher/masquer mot de passe">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7Z" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 4l18 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M6.2 6.8C4 8.7 2.5 12 2.5 12s3.5 7 9.5 7c2 0 3.7-.6 5.1-1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M9.2 9.3A3.5 3.5 0 0012 15.5c.6 0 1.1-.1 1.6-.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M17.8 17.2C20 15.3 21.5 12 21.5 12s-3.5-7-9.5-7c-1.2 0-2.4.3-3.4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
 
      <div class="options">
        <label class="checkbox">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" [disabled]="isLoading">
          <span>Se souvenir de moi</span>
        </label>
        <a href="#" class="link-sub">Mot de passe oublié ?</a>
      </div>
 
      <button type="submit" class="primary-btn" [disabled]="isLoading || !form.email || !form.password">
        {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>
    </form>
 
    <div class="auth-footer">
      <p>
        Pas encore de compte ?
        <a routerLink="/register" class="link">Créer un compte</a>
      </p>
    </div>
 
  </div>
</div>
